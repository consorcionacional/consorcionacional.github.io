<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Consórcio · Crachá digital</title>
<meta name="description" content="Fale comigo e receba uma simulação de consórcio sob medida.">
<meta property="og:type" content="website"><meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Crachá digital · Consultora de Consórcio">
<meta property="og:description" content="Fale comigo e receba uma simulação de consórcio sob medida.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ac:#2563eb;--ac2:#60a5fa;--bg:#0b1424;--bg2:#0f1b31;--card:#13223d;--card2:#182a4a;--line:#22385e;--tx:#e8f0fc;--mut:#8ea3c4;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg2);color:var(--tx);font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:80px}
label.l{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin:0 0 5px;letter-spacing:.02em}
.f{margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx);font-weight:700;cursor:pointer;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.wa{background:#16a34a;border-color:#16a34a;color:#fff}
.btn.d{background:transparent;border-color:#7f1d1d;color:#fca5a5}
.btn.s{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.g{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.hide{display:none!important}
.mut{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg2);cursor:pointer;font-weight:700;font-size:13px;user-select:none}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip small{opacity:.7;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:92vw;text-align:center}
.toast.ok{border-color:#166534;background:#052e16}.toast.err{border-color:#7f1d1d;background:#450a0a}
.ov{position:fixed;inset:0;background:rgba(2,6,16,.72);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;backdrop-filter:blur(3px)}
.md{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;margin-bottom:6vh}
.md.lg{max-width:820px}
.md-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);border-radius:18px 18px 0 0;z-index:2}
.md-h b{font-size:16px}
.md-b{padding:18px}
.x{background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer;line-height:1;padding:4px 8px}

/* ===== LOGIN ===== */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lg{width:100%;max-width:380px}
.lg h1{font-size:22px;margin:0 0 4px;font-weight:900}
.demo-box{margin-top:14px;padding:13px;border-radius:12px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);font-size:13px;line-height:1.5}

/* ===== APP ===== */
#app{display:flex;min-height:100vh}
.sb{width:248px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.sb-hd{display:flex;align-items:center;gap:10px;padding:4px 6px 16px}
.av{width:40px;height:40px;border-radius:12px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;flex-shrink:0;color:#fff}
.av img{width:100%;height:100%;object-fit:cover}
.sb-hd b{display:block;font-size:14px}.sb-hd span{font-size:11.5px;color:var(--mut)}
.nv{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border-radius:10px;border:none;background:none;color:var(--mut);font-weight:700;cursor:pointer;text-align:left;font-size:14px;margin-bottom:2px}
.nv:hover{background:var(--card)}
.nv.on{background:var(--card2);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
.nv .bd{margin-left:auto;background:var(--ac);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.nv-sec{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#5d7396;margin:14px 10px 6px;text-transform:uppercase}
.mn{flex:1;min-width:0}
.tb{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,20,36,.92);backdrop-filter:blur(10px);z-index:50}
.tb h2{margin:0;font-size:17px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{display:none;background:none;border:none;font-size:22px;color:var(--tx);cursor:pointer;padding:2px 6px}
.ct{padding:20px;max-width:1100px}
.demo-tag{background:#78350f;color:#fde68a;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px}
@media(max-width:860px){
  .sb{position:fixed;left:0;top:0;z-index:150;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.6)}
  .sb.open{transform:none}
  .hb{display:block}
  .ct{padding:14px}
  .tb{padding:10px 14px}
}
.sb-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:140}

.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.k span{display:block;font-size:11.5px;color:var(--mut);font-weight:700}
.k b{display:block;font-size:24px;font-weight:900;margin-top:4px;letter-spacing:-.02em}
.k small{font-size:11.5px;color:var(--mut)}
.sec-t{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:20px 0 10px}
.bars .br{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bars .tr{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--ac);border-radius:99px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.row2{grid-template-columns:1fr}}

.tlb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tlb input{flex:1;min-width:180px}
.tlb select{width:auto}
.ls{display:grid;gap:9px}
.ld{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.ld:hover{border-color:#33507f}
.ld .nm{font-weight:800;font-size:14.5px}
.ld .sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.ld .tg{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.ld .ac{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.ld.late{border-left:3px solid var(--err)}.ld.today{border-left:3px solid var(--warn)}
.empty{text-align:center;color:var(--mut);padding:40px 14px;font-size:14px}
.fab{position:fixed;right:18px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;border:none;font-size:28px;box-shadow:0 10px 26px rgba(0,0,0,.45);cursor:pointer;z-index:60}

.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{position:relative;margin-bottom:12px;font-size:13.5px}
.tl .it:before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.tl .it small{display:block;color:var(--mut);font-size:11.5px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;line-height:1.6}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--mut);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl-w{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.res{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px}
.res .big{font-size:30px;font-weight:900;letter-spacing:-.02em}
.res .ln{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.sticky{position:sticky;top:76px}
.cores{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cr{width:32px;height:32px;border-radius:9px;border:2px solid transparent;cursor:pointer}
.cr.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
.lnk{display:flex;gap:8px}
.lnk input{font-size:13px}
#qr{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.tpl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.tpl-pick .tp{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;color:var(--tx)}
.tpl-pick .tp b{display:block;margin-bottom:4px}
.tpl-pick .tp span{font-size:12.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== CRACHÁ (público e prévia) ===== */
.badge{background:#fff;color:#0f172a;border-radius:24px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);max-width:360px;margin:0 auto;position:relative}
.bg-top{height:150px;background:linear-gradient(135deg,var(--ac),var(--ac2));position:relative;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.bg-top:after{content:'';position:absolute;left:-10%;right:-10%;bottom:-60px;height:110px;background:#fff;border-radius:50% 50% 0 0/100% 100% 0 0;transform:rotate(-6deg)}
.bg-top b{font-size:17px;font-weight:900;letter-spacing:-.01em;max-width:62%;line-height:1.15}
.bg-top span{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.95}
.bg-ph{width:172px;height:206px;margin:-92px auto 0;position:relative;z-index:2;border-radius:18px;border:6px solid #fff;box-shadow:0 12px 30px -8px rgba(0,0,0,.35);background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:54px;font-weight:900;overflow:hidden}
.bg-ph img{width:100%;height:100%;object-fit:cover}
.bg-nm{text-align:center;padding:14px 18px 2px}
.bg-nm h1{margin:0;font-size:25px;font-weight:900;letter-spacing:-.02em;color:#0f172a}
.bg-nm p{margin:4px 0 0;color:var(--ac);font-weight:800;font-size:14px}
.bg-inf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 18px 18px;font-size:12px}
.bg-inf small{display:block;font-size:9px;font-weight:800;letter-spacing:.08em;color:#64748b;text-transform:uppercase;margin-bottom:2px}
.bg-inf b{font-weight:800;color:#0f172a;word-break:break-word}
.bg-ft{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;text-align:center;font-weight:800;font-size:11.5px;letter-spacing:.1em;padding:13px;text-transform:uppercase}

#pub{min-height:100vh;background:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--ac) 35%,transparent),transparent 45%),linear-gradient(180deg,#0b1424,#070d18);padding:22px 14px 50px}
.pb{max-width:440px;margin:0 auto}
.pb-wa{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0 12px;padding:17px;border-radius:16px;background:#16a34a;color:#fff;font-weight:900;font-size:17px;text-decoration:none;box-shadow:0 14px 30px -10px rgba(22,163,74,.7);border:none;width:100%;cursor:pointer}
.pb-rd{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pb-rd a{width:48px;height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-decoration:none}
.pb-rd svg{width:22px;height:22px}
.pb-ac{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pb-s{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.pb-s h2{margin:0 0 6px;font-size:18px;font-weight:900}
.pb-s p{margin:0;color:var(--mut);line-height:1.55;font-size:14px}
.pb-dst{list-style:none;padding:0;margin:12px 0 0}
.pb-dst li{padding:8px 0 8px 28px;position:relative;font-size:14px;line-height:1.45}
.pb-dst li:before{content:'✓';position:absolute;left:0;top:7px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.pb-st{display:grid;gap:10px;margin-top:12px}
.pb-st div{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45}
.pb-st i{font-style:normal;flex-shrink:0;width:28px;height:28px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--ac2)}
.pb-q{font-size:13px;font-weight:800;margin:16px 0 8px}
.ok-ic{width:70px;height:70px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;font-size:34px;margin:4px auto 12px}
.lgpd{font-size:12px;color:var(--mut);display:flex;gap:9px;align-items:flex-start;margin:14px 0;line-height:1.45}
.lgpd input{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.pb-foot{text-align:center;color:#5d7396;font-size:11.5px;margin-top:22px;line-height:1.6}
.load{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--mut)}
</style>
</head>
<body>

<div id="boot" class="load">Carregando…</div>
<div id="pub" class="hide"></div>
<div id="login" class="hide"></div>
<div id="app" class="hide">
  <aside class="sb" id="sb"></aside>
  <div class="mn">
    <div class="tb"><button class="hb" onclick="menu(true)">☰</button><h2 id="tt">Início</h2><span id="tb-r" style="display:flex;gap:8px;align-items:center"></span></div>
    <div class="ct" id="ct"></div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — cole aqui os dados do Supabase (Project Settings > API)
   Deixe vazio para usar o MODO DEMONSTRAÇÃO (dados no próprio navegador).
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: '',
  SUPABASE_KEY: ''
};
/* ===================================================================== */

const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const soDig = s => String(s || '').replace(/\D/g,'');
const brl = v => (v == null || v === '' || isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brl2 = v => (v == null || v === '' || isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function parseNum(s){ if(typeof s === 'number') return s; s = String(s||'').replace(/[^\d,.-]/g,''); if(!s) return null; if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,''); const n = Number(s); return isNaN(n) ? null : n; }
function waNum(s){ let d = soDig(s); if(d.length === 10 || d.length === 11) d = '55' + d; return d; }
function waLink(num, txt){ const n = waNum(num); return 'https://wa.me/' + (n || '') + '?text=' + encodeURIComponent(txt || ''); }
function fmtTel(s){ let d = soDig(s); if(d.length > 11 && d.startsWith('55')) d = d.slice(2); if(d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if(d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return s || ''; }
function hojeISO(d){ d = d || new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function addDias(iso, n){ const d = new Date((iso || hojeISO()) + 'T12:00:00'); d.setDate(d.getDate() + n); return hojeISO(d); }
function fmtD(iso){ if(!iso) return '—'; const p = String(iso).slice(0,10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }
function fmtDH(ts){ if(!ts) return '—'; const d = new Date(ts); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function rel(ts){ const m = Math.round((Date.now() - new Date(ts)) / 6e4); if(m < 1) return 'agora'; if(m < 60) return `há ${m} min`; const h = Math.round(m/60); if(h < 24) return `há ${h} h`; const d = Math.round(h/24); return d === 1 ? 'ontem' : `há ${d} dias`; }
function uid(n){ const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; const r = crypto.getRandomValues(new Uint8Array(n || 12)); r.forEach(x => s += a[x % a.length]); return s; }
function primeiro(n){ return String(n || '').trim().split(/\s+/)[0] || ''; }
function iniciais(n){ const p = String(n || '?').trim().split(/\s+/); return ((p[0]||'')[0] + ((p.length > 1 ? p[p.length-1] : '')[0] || '')).toUpperCase(); }
function mix(hex, pct){ const h = String(hex||'#2563eb').replace('#',''); const n = parseInt(h.length === 3 ? h.split('').map(x=>x+x).join('') : h, 16); if(isNaN(n)) return hex; let r = n>>16, g = (n>>8)&255, b = n&255; r = Math.round(r+(255-r)*pct); g = Math.round(g+(255-g)*pct); b = Math.round(b+(255-b)*pct); return '#' + [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function tema(cor){ document.documentElement.style.setProperty('--ac', cor || '#2563eb'); document.documentElement.style.setProperty('--ac2', mix(cor, .38)); }
function toast(msg, tipo){ $$('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast ' + (tipo || ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function modal(titulo, html, lg){ const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = `<div class="md ${lg?'lg':''}"><div class="md-h"><b>${titulo}</b><button class="x" aria-label="Fechar">×</button></div><div class="md-b">${html}</div></div>`; let dn = null; o.addEventListener('pointerdown', e => dn = e.target); o.addEventListener('click', e => { if(e.target === o && dn === o) fechar(); }); o.querySelector('.x').onclick = () => fechar(); document.body.appendChild(o); document.body.style.overflow = 'hidden'; function fechar(){ o.remove(); if(!$('.ov')) document.body.style.overflow = ''; } o.fechar = fechar; return o; }
function copiar(t, msg){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast(msg || 'Copiado!','ok')).catch(() => { prompt('Copie:', t); }); }
function carregarScript(src){ return new Promise((ok, er) => { if($$('script').some(s => s.src === src)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = er; document.head.appendChild(s); }); }
function baseURL(){ return location.origin + location.pathname; }
function linkCracha(slug, extra){ return baseURL() + '?c=' + encodeURIComponent(slug || '') + (extra ? '&' + extra : ''); }

function visitante(){ let v = localStorage.getItem('pc_vis'); if(!v){ v = uid(12); try{ localStorage.setItem('pc_vis', v); }catch(e){} } return v; }
function codigoVisitante(){ const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let h = 0; for(const ch of visitante()) h = (h*31 + ch.charCodeAt(0)) >>> 0; let s = ''; for(let i=0;i<4;i++){ s += a[h % 32]; h = Math.floor(h/32) + 7919*(i+1); } return s; }
function capturarAtrib(){
  const q = new URLSearchParams(location.search), cur = {};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(k => { const v = q.get(k); if(v) cur[k] = v.slice(0,150); });
  const fb = q.get('fbclid'), gc = q.get('gclid') || q.get('wbraid') || q.get('gbraid'), tt = q.get('ttclid');
  if(fb || gc || tt){ cur.click_id = (fb ? 'fb:' + fb : gc ? 'g:' + gc : 'tt:' + tt).slice(0,300); cur.utm_source = cur.utm_source || (fb ? 'meta' : tt ? 'tiktok' : 'google'); cur.utm_medium = cur.utm_medium || 'cpc'; }
  let salvo = null; try{ salvo = JSON.parse(localStorage.getItem('pc_attr') || 'null'); }catch(e){}
  if(Object.keys(cur).length){ cur.referrer = (document.referrer||'').slice(0,300); cur.landing = location.href.slice(0,500); cur.ts = Date.now(); try{ localStorage.setItem('pc_attr', JSON.stringify(cur)); }catch(e){} return cur; }
  if(salvo && Date.now() - salvo.ts < 90*864e5) return salvo;   // lembra a campanha por 90 dias
  return {referrer:(document.referrer||'').slice(0,300), landing:location.href.slice(0,500)};
}

function supaAPI(){
  let sb = null;
  const U = CONFIG.SUPABASE_URL.replace(/\/+$/,''), K = CONFIG.SUPABASE_KEY;
  const hdr = () => { const h = {'Content-Type':'application/json', apikey:K}; if(/^eyJ/.test(K)) h.Authorization = 'Bearer ' + K; return h; };
  async function rpc(fn, body){ const r = await fetch(`${U}/rest/v1/rpc/${fn}`, {method:'POST', headers:hdr(), body:JSON.stringify(body)}); const t = await r.text(); if(!r.ok){ let m = t; try{ m = JSON.parse(t).message || t; }catch(e){} throw new Error(m); } return t ? JSON.parse(t) : null; }
  async function cli(){ if(sb) return sb; await carregarScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'); sb = supabase.createClient(U, K); return sb; }
  const ok = ({data, error}) => { if(error) throw new Error(error.message); return data; };
  return {
    async sessao(){ const s = await cli(); const {data} = await s.auth.getSession(); return !!data.session; },
    async entrar(e, p){ const s = await cli(); const {error} = await s.auth.signInWithPassword({email:e, password:p}); if(error) throw new Error(/invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : error.message); },
    async sair(){ const s = await cli(); await s.auth.signOut(); },
    async trocarSenha(n){ const s = await cli(); const {error} = await s.auth.updateUser({password:n}); if(error) throw new Error(error.message); },
    async eu(){ const s = await cli(); const {data:{user}} = await s.auth.getUser(); const a = ok(await s.from('admins').select('user_id').eq('user_id', user.id)); const c = ok(await s.from('consultoras').select('*').order('nome')); return {admin: a.length > 0, consultoras: c, email: user.email}; },
    async salvarConsultora(id, p){ const s = await cli(); return ok(await s.from('consultoras').update(p).eq('id', id).select().single()); },
    async leads(cid){ const s = await cli(); return ok(await s.from('leads').select('*').eq('consultora_id', cid).order('criado_em', {ascending:false}).limit(5000)); },
    async salvarLead(l){ const s = await cli(); const {id, ...d} = l; return id ? ok(await s.from('leads').update(d).eq('id', id).select().single()) : ok(await s.from('leads').insert(d).select().single()); },
    async excluirLead(id){ const s = await cli(); ok(await s.from('leads').delete().eq('id', id)); },
    async interacoes(lid){ const s = await cli(); return ok(await s.from('interacoes').select('*').eq('lead_id', lid).order('criado_em', {ascending:false})); },
    async addInteracao(lid, tipo, texto){ const s = await cli(); return ok(await s.from('interacoes').insert({lead_id:lid, tipo, texto}).select().single()); },
    async eventos(cid, desde){ const s = await cli(); return ok(await s.from('eventos').select('tipo,codigo,utm_source,utm_medium,utm_campaign,utm_content,click_id,criado_em').eq('consultora_id', cid).gte('criado_em', desde).order('criado_em', {ascending:false}).limit(20000)); },
    async ouvir(cid, cb){ const s = await cli(); s.channel('leads-' + cid).on('postgres_changes', {event:'INSERT', schema:'public', table:'leads', filter:'consultora_id=eq.' + cid}, p => cb(p.new)).subscribe(); },
    perfil: slug => rpc('perfil_publico', {p_slug: slug}),
    evento: (slug, tipo, d) => rpc('registrar_evento', {p_slug: slug, p_tipo: tipo, p_dados: d}).catch(() => {}),
    leadPublico: (slug, d) => rpc('registrar_lead', {p_slug: slug, p_dados: d})
  };
}

function listarLeads(){
  const b = S.busca.toLowerCase().trim(), bd = soDig(b);

function simCalc(){
  const C = parseNum($('#s-c').value) || 0, n = Math.max(1, parseNum($('#s-n').value) || 1), a = parseNum($('#s-a').value) || 0, f = parseNum($('#s-f').value) || 0, s = parseNum($('#s-s').value) || 0, red = +$('#s-r').value, L = parseNum($('#s-l').value) || 0;

        <p class="mut" style="font-size:12px;margin:0 0 10px">Vale para vendas de leads de tráfego pago. Se o valor fixo for maior que zero, ele substitui o %.</p>
        <div class="g2"><div class="f"><label class="l">Meta Pixel ID</label><input id="g-px" value="${esc(c.pixel_meta || '')}" placeholder="Ex.: 123456789012345"></div><div class="f"><label class="l">Google tag (G-/AW-)</label><input id="g-gt" value="${esc(c.gtag_id || '')}" placeholder="Ex.: AW-123456789"></div></div>
        <div class="g2"><div class="f"><label class="l">Endereço do crachá (slug)</label><input id="g-sl" value="${esc(c.slug)}"></div><label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:18px"><input type="checkbox" id="g-at" style="width:18px;height:18px" ${c.ativo !== false ? 'checked' : ''}> Crachá ativo</label></div>
        <button class="btn p" onclick="gSalvar()">Salvar regra</button></div>
      <div class="card"><div class="sec-t" style="margin-top:0">Link para anúncios</div>
        <div class="g2"><div class="f"><label class="l">Plataforma</label><select id="g-src" onchange="gLink()"><option value="meta">Meta (Facebook/Instagram)</option><option value="google">Google Ads</option><option value="tiktok">TikTok Ads</option></select></div><div class="f"><label class="l">Nome da campanha</label><input id="g-cp" placeholder="imovel-recife-nov" oninput="gLink()"></div></div>
        <div class="lnk"><input id="g-url" readonly><button class="btn s" onclick="copiar($('#g-url').value)">Copiar</button></div>
        <p class="mut" style="font-size:12.5px;margin:12px 0 6px"><b>No Meta Ads</b>, use o link do crachá como URL do site e cole em <b>Parâmetros de URL</b>:</p>
        <div class="lnk"><input readonly value="utm_source=meta&utm_medium=cpc&utm_campaign={{campaign.name}}&utm_content={{ad.name}}"><button class="btn s" onclick="copiar('utm_source=meta&utm_medium=cpc&utm_campaign={{campaign.name}}&utm_content={{ad.name}}')">Copiar</button></div>
        <p class="mut" style="font-size:12px;margin:10px 0 0">Mesmo sem esses parâmetros, cliques com fbclid/gclid/ttclid já contam como anúncio. Quem clica no WhatsApp sem preencher leva o código (“cód. XXXX”) na mensagem: a consultora cadastra o lead com esse código e a origem é puxada automaticamente.</p></div>
    </div>`;
  gLink();
}
function gLink(){ const s = $('#g-src').value, cp = ($('#g-cp').value || 'campanha').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-_]/g,''); $('#g-url').value = linkCracha(S.cons.slug, `utm_source=${s}&utm_medium=cpc&utm_campaign=${cp}`); }
async function gSalvar(){ const p = {comissao_pct:parseNum($('#g-pct').value) || 0, comissao_fixa:parseNum($('#g-fix').value) || 0, pixel_meta:$('#g-px').value.trim(), gtag_id:$('#g-gt').value.trim(), slug:$('#g-sl').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,''), ativo:$('#g-at').checked};
  if(!p.slug) return toast('Informe o slug.','err'); if(p.slug !== S.cons.slug && !confirm('Mudar o endereço quebra os links e QR codes já divulgados. Continuar?')) return;
  try{ const c = await API.salvarConsultora(S.cons.id, p); Object.assign(S.cons, c); toast('Regra salva! Vale para as próximas vendas.','ok'); vGestor(); }catch(e){ toast(e.message,'err'); } }
async function marcarPaga(id, v){ try{ const n = await API.salvarLead({id, comissao_paga:v}); atualizaLocal(n); toast(v ? 'Comissão marcada como paga.' : 'Comissão em aberto.','ok'); vGestor(); }catch(e){ toast(e.message,'err'); } }

/* =====================================================================
   INÍCIO
   ===================================================================== */
(function(){
  const q = new URLSearchParams(location.search), slug = q.get('c') || q.get('cracha');
  if(slug) iniciarPublico(slug); else iniciarPainel();
})();
</script>
</body>
